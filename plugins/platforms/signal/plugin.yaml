name: signal-platform
label: Signal
kind: platform
version: 2.0.0
description: >
  Signal gateway adapter for Hermes Agent backed by a persistent signal-ts
  sidecar: a Node process embedding the signal-ts SDK as a linked device
  (one authenticated socket for the gateway's lifetime, no signal-cli
  daemon). Supports DMs, allowlisted groups, attachments, reactions and
  home-channel cron delivery. Configured in config.yaml under
  platforms.signal; phone numbers are treated as PII in logs.
author: NousResearch
# No requires_env / optional_env: the runtime has no env credentials. Node, the SDK path, the
# linked-device state file and the access policy live in config.yaml (platforms.signal.extra).
